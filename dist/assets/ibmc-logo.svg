<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 270" role="img" aria-labelledby="title desc">
  <title id="title">Igbajo Baptist Medical Centre logo</title>
  <desc id="desc">A red double triangle surrounding a black cross. Healing follows the left side, Ministry follows the right side, and For the Glory of God sits along the base.</desc>
  <path d="M150 12 L288 252 L12 252 Z" fill="#fff" stroke="#c82333" stroke-width="7" stroke-linejoin="round"/>
  <path d="M150 55 L245 221 L55 221 Z" fill="none" stroke="#c82333" stroke-width="5" stroke-linejoin="round"/>
  <path d="M139 91 H161 V129 H192 V151 H161 V200 H139 V151 H108 V129 H139 Z" fill="#111"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="3.2">
    <text x="0" y="0" text-anchor="middle" transform="translate(99 139) rotate(-60)">HEALING</text>
    <text x="0" y="0" text-anchor="middle" transform="translate(201 139) rotate(60)">MINISTRY</text>
  </g>
  <text x="150" y="245" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="1.8" text-anchor="middle">FOR THE GLORY OF GOD</text>
</svg>
